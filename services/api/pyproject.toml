[project]
name = "repsight-api"
version = "0.0.0"
description = "RepSight API: FastAPI modular monolith, Python package `app` (05 §3.1)"
requires-python = ">=3.14.8,<3.15"
# Canon §10.2 pins; changing one needs an ADR (GR-17).
dependencies = [
    "fastapi==0.143.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build==0.12.24"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
